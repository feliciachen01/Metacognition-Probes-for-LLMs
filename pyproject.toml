[project]
name = "kwik"
version = "0.1.0"
description = "Does it know what it knows? Probes on an open model's hidden states that predict wrong answers before they finish."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.30",
  "datasets>=2.19",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "pyarrow>=14",
  "numpy>=1.24",
  "pyyaml>=6",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
kwik = "kwik.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
